name: Broadcast IP Test

on:
  workflow_dispatch:

jobs:
  broadcast-test-hr-latest:
    runs-on: ubuntu-26.04
    steps:

      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # rc
        with:
          egress-policy: block
          allowed-endpoints: >
            archive.ubuntu.com:443
            azure.archive.ubuntu.com:443
            azure.archive.ubuntu.com:80
            esm.ubuntu.com:443
            packages.microsoft.com:443
            security.ubuntu.com:443
    
      - name: Setup
        run: |
          sudo sysctl -w net.ipv4.icmp_echo_ignore_broadcasts=0
          sudo apt-get update && sudo apt-get install -y socat

      - name: Start Broadcast Listener (background)
        run: |
          nohup socat -v UDP-RECVFROM:6000,broadcast,fork EXEC:'tee received.txt' &

      - name: Send Broadcast
        run: |
          socat -v - UDP-DATAGRAM:255.255.255.255:6000,broadcast <<< "Hello from broadcast"

      - name: Show Received Output
        run: |
          cat received.txt || echo "Nothing received"

      - name: DNS debug
        if: always()
        continue-on-error: true
        run: |
          set +e
          resolvectl status
          ls -la /etc/systemd/resolved.conf.d/ /run/systemd/resolved.conf.d/ 2>&1
          cat /etc/resolv.conf
          ss -lunp | grep ':53'
          resolvectl query github.com
          resolvectl query registry-1.docker.io
          getent hosts github.com
          