name: Agent kill test

on:
  workflow_dispatch:

jobs:
  latest:
    runs-on: ubuntu-26.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: prateek-stepsecurity/harden-runner@d371928df34bdfd0107881b3f672cc0f97c8355b # int
        with:
          egress-policy: audit
          
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # main

      - name: do curl calls
        if: always()
        run: |
          curl -v -4 google.com
          curl -v -4 youtube.com
          curl -v -4 microsoft.com
          curl -v -4 bing.com
          
      - name: stop agent 
        run: |
         set -x
         doWork(){
           systemctl --version
           pidof agent || true
           sudo strace -f systemctl stop agent.service || true
           pidof agent || true
         }
         doWork || true
      - name: print agent logs
        if: always()
        run: sudo cat /home/agent/agent.log

      - name: DNS debug
        if: always()
        continue-on-error: true
        run: |
          set +e
          resolvectl status
          ls -la /etc/systemd/resolved.conf.d/ /run/systemd/resolved.conf.d/ 2>&1
          cat /etc/resolv.conf
          ss -lunp | grep ':53'
          resolvectl query github.com
          resolvectl query registry-1.docker.io
          getent hosts github.com
        