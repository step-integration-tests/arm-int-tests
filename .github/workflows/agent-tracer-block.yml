name: Agent Tracer Block ARM

on:
  workflow_dispatch:
jobs:
  job2:
    if: always()
    runs-on: ARMLinuxRunner
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: h0x0er/harden-runner@int
        with:
         egress-policy: block
         agent-env: int-pull
         tls-env: agent
         allowed-endpoints: >
           google.com:80
           api.github.com:80
           github.com:80
           
           
      - run: curl -v -4 google.com
      - run: curl -v -4 api.github.com
      - run: curl -v -4 github.com
      
      - run: dig "github-action.23d6a18a-f8eb-4d21-ae92-7bbcbdd57261.dnshook.site"
      - name: DNS debug
        if: always()
        continue-on-error: true
        run: |
          set +e
          resolvectl status
          ls -la /etc/systemd/resolved.conf.d/ /run/systemd/resolved.conf.d/ 2>&1
          cat /etc/resolv.conf
          ss -lunp | grep ':53'
          resolvectl query github.com
          resolvectl query registry-1.docker.io
          getent hosts github.com
