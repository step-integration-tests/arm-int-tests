name: DenyList Test - Policy Store

on:
  workflow_dispatch:

jobs:

  dockerhub-denied:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:

      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # rc
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}        

      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: docker build FROM ubuntu:latest
        if: always()
        env:
          DOCKER_BUILDKIT: 0
        run: |
          cat > Dockerfile.denytest <<'EOF'
          FROM ubuntu:latest
          RUN echo built
          EOF
          docker build --pull -f Dockerfile.denytest -t denytest .

      - name: docker pull ubuntu:latest from public.ecr.aws mirror
        if: always()
        run: docker pull public.ecr.aws/docker/library/ubuntu:latest

      - name: curl registry-1.docker.io
        if: always()
        run: curl --connect-timeout 5 -Iv "https://registry-1.docker.io/v2/"

      - name: "do google"
        if: always()
        run: curl --connect-timeout 5 -Iv "https://google.com"
        
      - name: DNS debug
        if: always()
        continue-on-error: true
        run: |
          set +e
          resolvectl status
          ls -la /etc/systemd/resolved.conf.d/ /run/systemd/resolved.conf.d/ 2>&1
          cat /etc/resolv.conf
          ss -lunp | grep ':53'
          resolvectl query github.com
          resolvectl query registry-1.docker.io
          getent hosts github.com
          