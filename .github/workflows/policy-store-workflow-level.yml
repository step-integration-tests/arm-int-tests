name: Policy Store - Workflow Level

on:
  workflow_dispatch:

jobs:
  workflow-level-policy:
    runs-on: ubuntu-26.04

    steps:
      - name: Harden the runner
        uses: prateek-stepsecurity/harden-runner@int
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - name: Checkout code
        uses: actions/checkout@v4

      - name: call google
        run: |
          curl https://google.com

      - name: call bing
        run: |
          curl https://bing.com

      - name: call microsoft
        run: |
          curl https://microsoft.com
