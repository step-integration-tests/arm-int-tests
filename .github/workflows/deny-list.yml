name: DenyList Test

on:
  workflow_dispatch:
        
jobs:

  enum:
    runs-on: ubuntu-latest
    steps:

      - uses: step-security/harden-runner@40b99cf0c7161e4dcdc6c5508927188b65028df9 # rc
        with:
          egress-policy: block
          denied-endpoints: >
            google.com:443
            1.1.1.1:80

      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
            
      - name: do google
        if: always()  
        run: curl --connect-timeout 5 -Iv "https://google.com"

      - name: do google.com:80
        if: always()  
        run: curl --connect-timeout 5 -Iv google.com:80
      
      - name: "do youtube"
        if: always()  
        run: curl --connect-timeout 5 -Iv "https://youtube.com"

      - name: "do bing"
        if: always()  
        run: curl --connect-timeout 5 -Iv "https://bing.com"

      - name: "do 1.1.1.1:443"
        if: always()  
        run: curl --connect-timeout 5 -Iv "https://1.1.1.1:443" 


      - name: "do 1.1.1.1:80"
        if: always()  
        run: curl --connect-timeout 5 -Iv "http://1.1.1.1:80" 
