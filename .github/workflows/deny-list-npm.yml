name: DenyList NPM Test

on:
  workflow_dispatch:

jobs:

  npm-denied:
    runs-on: ubuntu-latest
    steps:

      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # rc
        with:
          egress-policy: block
          denied-endpoints: >
            registry.npmjs.org:443

      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: npm ping
        if: always()
        run: npm ping

      - name: npm view express
        if: always()
        run: npm view express version

      - name: curl registry.npmjs.org
        if: always()
        run: curl --connect-timeout 5 -Iv "https://registry.npmjs.org"

      - name: "do google"
        if: always()
        run: curl --connect-timeout 5 -Iv "https://google.com"

  npm-allowed:
    runs-on: ubuntu-latest
    steps:

      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # rc
        with:
          egress-policy: block
          denied-endpoints: >
            google.com:443

      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: npm ping
        if: always()
        run: npm ping

      - name: npm view express
        if: always()
        run: npm view express version

      - name: curl registry.npmjs.org
        if: always()
        run: curl --connect-timeout 5 -Iv "https://registry.npmjs.org"

      - name: "do google"
        if: always()
        run: curl --connect-timeout 5 -Iv "https://google.com"
