name: Global Blocklist
on:
  workflow_dispatch:

jobs:
  build:
    name: Global-Blocklist
    runs-on: ubuntu-26.04
    steps:           
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: prateek-stepsecurity/harden-runner@149a4a33aa5c27c042b37b74f941b68e3ad14ccb # int
        with:
          egress-policy: audit   
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
      
      - name: curl dummyblock.com
        if: always()
        run: "curl dummyblock.com --connect-timeout 5 --max-time 5"
      - name: curl 2.2.2.2
        if: always()
        run: "curl 2.2.2.2 --connect-timeout 5 --max-time 5"
      - name: curl google.com
        if: always()
        run: "curl google.com:443  --connect-timeout 5 --max-time 5"

      - name: curl evil.invalid
        if: always()
        run: "curl https://evil.invalid:443 --connect-timeout 5 --max-time 5" 

      - name: DNS debug
        if: always()
        continue-on-error: true
        run: |
          set +e
          resolvectl status
          ls -la /etc/systemd/resolved.conf.d/ /run/systemd/resolved.conf.d/ 2>&1
          cat /etc/resolv.conf
          ss -lunp | grep ':53'
          resolvectl query github.com
          resolvectl query registry-1.docker.io
          getent hosts github.com