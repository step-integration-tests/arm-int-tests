name: Global Blocklist
on:
  workflow_dispatch:

jobs:
  build:
    name: Global-Blocklist
    runs-on: ubuntu-latest
    steps:           
     - name: Harden the runner (Audit all outbound calls)
       uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
       with:
         egress-policy: audit

     - uses: prateek-stepsecurity/harden-runner@d867105c9eeb1add8fb44cd8574129594c68cc17 # int
       with:
        egress-policy: audit   
     - uses: actions/checkout@v3
     
     - name: curl dummyblock.com
       if: always()
       run: "curl dummyblock.com --connect-timeout 5 --max-time 5"
     - name: curl 2.2.2.2
       if: always()
       run: "curl 2.2.2.2 --connect-timeout 5 --max-time 5"
     - name: curl google.com
       if: always()
       run: "curl google.com:443  --connect-timeout 5 --max-time 5"

     - name: curl evil.invalid
       if: always()
       run: "curl https://evil.invalid:443 --connect-timeout 5 --max-time 5" 
