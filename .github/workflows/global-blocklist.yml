name: Global Blocklist
on:
  workflow_dispatch:

jobs:
  build:
    name: Global-Blocklist
    runs-on: ubuntu-26.04
    steps:           
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: prateek-stepsecurity/harden-runner@int
        with:
          egress-policy: audit   
      - uses: actions/checkout@v3
      
      - name: curl dummyblock.com
        if: always()
        run: "curl dummyblock.com --connect-timeout 5 --max-time 5"
      - name: curl 2.2.2.2
        if: always()
        run: "curl 2.2.2.2 --connect-timeout 5 --max-time 5"
      - name: curl google.com
        if: always()
        run: "curl google.com:443  --connect-timeout 5 --max-time 5"

      - name: curl evil.invalid
        if: always()
        run: "curl https://evil.invalid:443 --connect-timeout 5 --max-time 5" 

      - name: DNS debug
        if: always()
        continue-on-error: true
        run: |
          set +e
          resolvectl status
          ls -la /etc/systemd/resolved.conf.d/ /run/systemd/resolved.conf.d/ 2>&1
          cat /etc/resolv.conf
          ss -lunp | grep ':53'
          resolvectl query github.com
          resolvectl query registry-1.docker.io
          getent hosts github.com